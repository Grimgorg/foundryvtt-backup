[package]
name = "foundryvtt-backup"
version = "0.1.0"
description = "Back up and restore Foundry VTT worlds to a cloud-synced folder"
authors = ["Grimgorg"]
license = "MIT"
repository = "https://github.com/Grimgorg/foundryvtt-backup"
edition = "2021"
rust-version = "1.90"

[lib]
name = "foundryvtt_backup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
walkdir = "2"
gethostname = "1"
dirs = "6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
