name: Release

# Push a tag like v0.1.0 to build installers for macOS, Windows and Linux.
# The result is a DRAFT GitHub release: check it, then click "Publish".
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            label: macos
          - platform: windows-latest
            args: ""
            label: windows
          - platform: ubuntu-22.04
            args: ""
            label: linux
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__ # must match the pushed tag; keep versions in sync
          releaseName: FoundryVTT Backup v__VERSION__
          releaseBody: |
            ## Downloads
            | OS | File | Notes |
            |---|---|---|
            | Windows | `FoundryVTT-Backup_*_windows_x64_portable.exe` | Single file, no install. Or use the `*-setup.exe` installer. |
            | macOS (Apple Silicon + Intel) | `*_universal.dmg` | Open the dmg and drag the app to Applications. |
            | Linux | `*.AppImage` | `chmod +x` the file and run it. A `.deb` is also attached. |

            The builds are not code-signed yet. See the README for how to open them on macOS (Gatekeeper) and Windows (SmartScreen).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Windows: also attach the raw exe as a portable single-file app.
      - name: Upload portable Windows exe
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          OUT="FoundryVTT-Backup_${VERSION}_windows_x64_portable.exe"
          cp src-tauri/target/release/foundryvtt-backup.exe "$OUT"
          gh release upload "v${VERSION}" "$OUT" --clobber
